<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet Time Capsule</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c232d;
    --line: #2b3440; --text: #c9d1d9; --dim: #8b98a5;
    --accent: #58a6ff; --warn: #d29922; --good: #3fb950; --bad: #f85149;
    --sel: #f2cc60;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0 8px 0 0; color: #fff; font-weight: 600; }
  header h1 span { color: var(--accent); }
  header .spacer { flex: 1; }
  #url-input {
    width: min(46vw, 520px); padding: 6px 10px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
  }
  button {
    background: #21262d; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:hover { background: #388bfd; color: #fff; }
  button.sel { border-color: var(--sel); color: var(--sel); }
  button:disabled { opacity: .45; cursor: default; }
  main { flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
  #sidebar, #stage, #diff { display: flex; flex-direction: column; min-height: 0; }
  #sidebar {
    border-right: 1px solid var(--line); background: var(--panel);
    padding: 10px 8px 4px;
  }
  #sidebar h2, #diff h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 4px 8px 8px; }
  #url-list { flex: 1; overflow-y: auto; }
  .u {
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; margin: 2px 4px;
  }
  .u:hover { background: var(--panel2); }
  .u.active { background: #10141b; border-color: var(--accent); }
  .u .t { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .u .m { color: var(--dim); font-size: 11px; }
  #stage { position: relative; }
  #stage-head {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  #stage-head .title { color: #fff; font-weight: 600; }
  #stage-head .when { color: var(--dim); font-size: 12px; }
  #slider-wrap { padding: 10px 16px 4px; border-bottom: 1px solid var(--line); }
  #timeline-slider { width: 100%; accent-color: var(--accent); }
  #slider-labels { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; }
  #preview { flex: 1; overflow-y: auto; background: #fff; color: #1b1f23; margin: 12px 16px; border-radius: 8px; padding: 12px 18px; }
  #preview img { max-width: 100%; }
  #preview a { color: #0969da; }
  #diff {
    position: absolute; top: 10px; right: 10px; width: 460px; max-height: 80%;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); display: none;
  }
  #diff.open { display: flex; }
  #diff-head { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #diff-head select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
  #diff-summary { padding: 6px 12px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); }
  #diff-summary b.plus { color: var(--good); }
  #diff-summary b.minus { color: var(--bad); }
  #diff-body { flex: 1; overflow-y: auto; padding: 6px 0; font: 12px/1.6 ui-monospace, Menlo, monospace; }
  #diff-body .l { padding: 2px 12px; white-space: pre-wrap; }
  #diff-body .add { background: rgba(63,185,80,.12); color: #56d364; }
  #diff-body .del { background: rgba(248,81,73,.12); color: #ff7b72; }
  #diff-body .cue { padding: 6px 12px; color: var(--warn); font-size: 11px; }
  #versions { padding: 6px 16px 14px; display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; }
  .vchip {
    border: 1px solid var(--line); background: var(--panel2); border-radius: 6px;
    padding: 5px 8px; font-size: 11px; cursor: pointer; position: relative;
  }
  .vchip:hover { border-color: var(--accent); }
  .vchip.on { border-color: var(--sel); color: var(--sel); }
  .vchip .delta { color: var(--dim); font-size: 10px; }
  .vchip .delta.grow { color: var(--good); }
  .vchip .delta.shrink { color: var(--bad); }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); }
  #empty .big { font-size: 44px; text-align: center; }
  #status { font-size: 12px; color: var(--dim); padding: 0 4px; }
  #status.err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>⌛ <span>Time capsule</span> — el archivo del tiempo</h1>
  <div class="spacer"></div>
  <span id="status"></span>
  <input id="url-input" placeholder="https://alguna.pagina/que-quieras-archivar" spellcheck="false">
  <button id="btn-capture" class="primary">Capturar ahora</button>
  <button id="btn-refresh" title="Refrescar índice">↻</button>
</header>
<main>
  <aside id="sidebar">
    <h2>Páginas archivadas</h2>
    <div id="url-list">
      <div id="empty"><div class="big">Sin capturas todavía<br><small>captura una URL o espera a que el servidor tenga archivo</small></div></div>
    </div>
  </aside>
  <section id="stage">
    <div id="stage-head">
      <span class="title" id="cur-title">—</span>
      <span class="when" id="cur-when">—</span>
      <span class="when" id="cur-meta" style="margin-left:auto"></span>
      <button id="btn-diff">Comparar versiones</button>
    </div>
    <div id="slider-wrap">
      <input type="range" id="timeline-slider" min="0" max="1000" value="1000" step="1" disabled>
      <div id="slider-labels"><span id="t-first">—</span><span id="t-last">—</span></div>
    </div>
    <div id="versions"></div>
    <div id="preview"><p style="color:#888">Selecciona una página en el lateral izquierdo.</p></div>

    <div id="diff">
      <div id="diff-head">
        <h2 style="margin:0; flex:none;">Diff</h2>
        <select id="diff-a"></select>
        <span style="color:var(--dim)">→</span>
        <select id="diff-b"></select>
        <button id="btn-diff-close">✕</button>
      </div>
      <div id="diff-summary"></div>
      <div id="diff-body"></div>
    </div>
  </section>
</main>
<script src="js/web.js"></script>
</body>
</html>
